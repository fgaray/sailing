<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BKS Exam Trainer</title>
<meta name="description" content="Practice the ASA 101 Basic Keelboat written exam with adaptive flash-card style multiple choice questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M30 6 L30 46 L10 46 Z' fill='%232457d6'/%3E%3Cpath d='M34 12 L34 46 L52 46 Z' fill='%23e8830c'/%3E%3Cpath d='M6 50 L58 50 L50 58 L14 58 Z' fill='%231d2433'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#eeebe3; --ink:#1b2232; --ink-2:#465066; --muted:#737c90;
  --line:#dcd6ca; --primary:#2457d6; --primary-2:#1c46ad; --primary-ink:#ffffff; --primary-soft:#e3eafb;
  --accent:#e8830c; --accent-soft:#fcd9a8; --good:#1d8549; --good-bg:#e1f3e8; --bad:#c23b3b; --bad-bg:#fae6e6;
  --sky:#f4f8fb; --water:#d6e8f4; --water-2:#b9d6ea; --hull:#ffffff; --hull-2:#e9e6de; --sail:#f2efe6; --sailT:#2457d6;
  --red:#d2372b; --green:#1f8a4c; --orange:#e8710c; --focus:#ffb02e;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06);
  --radius:16px; --scale:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161f; --surface:#1b212d; --surface-2:#242b39; --ink:#eef1f7; --ink-2:#b7bfcf; --muted:#8a93a6;
    --line:#2f3747; --primary:#6f9bff; --primary-2:#8cb0ff; --primary-ink:#0d1220; --primary-soft:#22304f;
    --accent:#ffa53a; --accent-soft:#6b4415; --good:#4cc782; --good-bg:#17342a; --bad:#ff7a7a; --bad-bg:#3d1f24;
    --sky:#18202c; --water:#1b3042; --water-2:#21405a; --hull:#2a3242; --hull-2:#343d4f; --sail:#2c3444; --sailT:#8cb0ff;
    --red:#ff5a4d; --green:#3fcf7d; --orange:#ff8a2a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161f; --surface:#1b212d; --surface-2:#242b39; --ink:#eef1f7; --ink-2:#b7bfcf; --muted:#8a93a6;
  --line:#2f3747; --primary:#6f9bff; --primary-2:#8cb0ff; --primary-ink:#0d1220; --primary-soft:#22304f;
  --accent:#ffa53a; --accent-soft:#6b4415; --good:#4cc782; --good-bg:#17342a; --bad:#ff7a7a; --bad-bg:#3d1f24;
  --sky:#18202c; --water:#1b3042; --water-2:#21405a; --hull:#2a3242; --hull-2:#343d4f; --sail:#2c3444; --sailT:#8cb0ff;
  --red:#ff5a4d; --green:#3fcf7d; --orange:#ff8a2a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(17px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
header.app{display:flex;align-items:center;gap:10px;padding:4px 0 14px}
header.app h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.2px;flex:1;display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;font-size:1.05rem}
.iconbtn:hover{border-color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.hero h2{font-size:1.6rem;line-height:1.2;margin:0 0 6px}
.hero p{margin:0 0 16px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.35rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:14px;border:2px solid transparent;cursor:pointer;font-weight:700;font-size:1rem;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-2)}
.btn.secondary{background:var(--surface);border-color:var(--line)}
.btn.secondary:hover{border-color:var(--primary)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kbd{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 .35em;border-radius:6px;border:1px solid currentColor;font-size:.72em;opacity:.75;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.section-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px;font-weight:700}
.topics{display:grid;gap:8px}
.topic{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;text-align:left}
.topic[aria-pressed="false"]{opacity:.5}
.topic .ic{font-size:1.3rem;width:1.6em;text-align:center}
.topic .nm{font-weight:700}
.topic .bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px;display:flex}
.topic .bar i{display:block;height:100%}
.topic .bar .m{background:var(--good)}
.topic .bar .l{background:var(--accent)}
.topic .ct{font-size:.85rem;color:var(--muted)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.topic[aria-pressed="true"] .check{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
details.help{margin-top:12px}
details.help summary{cursor:pointer;font-weight:700;padding:8px 0}
details.help ul{padding-left:1.2em;color:var(--ink-2);margin:6px 0}
details.help li{margin:4px 0}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Question screen */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:8px;background:var(--surface-2);transition:background .3s}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.cur{background:var(--primary)}
.count{font-size:.85rem;color:var(--muted);min-width:3.5em;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 10px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.prompt{font-size:1.35rem;line-height:1.38;margin:4px 0 14px;font-weight:400}
.prompt strong{font-weight:700;color:var(--primary)}
.prompt blockquote{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--primary);background:var(--primary-soft);border-radius:0 10px 10px 0;font-size:1.1rem}
.figure{margin:0 0 14px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.multi-note{font-size:.9rem;font-weight:700;color:var(--accent);margin:-6px 0 10px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.02rem;line-height:1.35;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt .key{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-2);font-weight:700;font-size:.9rem;color:var(--ink-2)}
.opt .mark{font-weight:700;font-size:1.15rem;width:1.2em;text-align:center}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .key{background:var(--primary);color:var(--primary-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .key{background:var(--good);color:#fff}
.opt.ok .mark{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .key{background:var(--bad);color:#fff}
.opt.no .mark{color:var(--bad)}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt[disabled]{cursor:default}
#qcard:focus{outline:none}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;animation:rise .25s ease-out}
.fb.good{background:var(--good-bg);border:1px solid var(--good)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{margin:0 0 6px;font-size:1.1rem}
.fb.good h3{color:var(--good)} .fb.bad h3{color:var(--bad)}
.fb p{margin:6px 0}
.fb .hook{background:var(--surface);border-radius:10px;padding:8px 12px;margin-top:10px}
.fb .ref{font-size:.82rem;color:var(--muted);margin-top:8px}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.actionbar .inner{max-width:720px;margin:0 auto;display:flex;gap:10px}
.actionbar .btn{flex:1;min-height:54px;padding:10px}
.btn.hard{background:var(--surface);border-color:var(--accent);color:var(--ink)}
.btn.easy{background:var(--surface);border-color:var(--good);color:var(--ink)}
.sub{display:block;font-size:.72rem;font-weight:400;opacity:.8}
.btn .stack{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;animation:toast 2.2s ease forwards;pointer-events:none;white-space:nowrap}
.xp{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);font-weight:700;color:var(--good);animation:float 1s ease-out forwards;pointer-events:none;z-index:40}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:45}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}

/* Summary + break */
.big{font-size:3rem;line-height:1;margin:4px 0 8px}
.center{text-align:center}
.breathe{width:160px;height:160px;border-radius:50%;margin:24px auto;background:radial-gradient(circle,var(--primary-soft),var(--primary));animation:breathe 8s ease-in-out infinite;display:grid;place-items:center;color:var(--primary-ink);font-weight:700}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss:first-child{border-top:0}
.miss .q{font-weight:700}
.miss .a{color:var(--good);margin-top:4px}
.miss .y{color:var(--bad);font-size:.9rem}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.settings label:last-child{border-bottom:0}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog h2{margin:0 0 8px}

/* Diagrams */
.dia{width:100%;height:auto;display:block;max-height:44vh}
.dia .sky{fill:var(--sky)} .dia .sea{fill:var(--water)} .dia .seaover{fill:var(--water-2);opacity:.45}
.dia .hullshape{fill:var(--hull);stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.dia .solid{fill:var(--hull-2);stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.dia .wire{stroke:var(--ink-2);stroke-width:1.6;fill:none}
.dia .line{stroke:var(--ink-2);stroke-width:1.6;fill:none;stroke-dasharray:4 3}
.dia .spar{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.dia .sailfill{fill:var(--sail);stroke:none}
.dia .edge{stroke:var(--ink-2);stroke-width:2;fill:none;stroke-linecap:round}
.dia .deckline{stroke:var(--ink-2);stroke-width:2.5;fill:none}
.dia .zone{fill:transparent;stroke:none}
.dia .port{fill:var(--ink-2)}
.dia .hl{stroke:var(--accent)!important;stroke-width:5!important}
.dia .spar.hl{stroke-width:8!important}
.dia .solid.hl,.dia .sailfill.hl{fill:var(--accent-soft)!important}
.dia .zone.hl{fill:var(--accent)!important;fill-opacity:.35;stroke:var(--accent)!important;stroke-width:3!important}
.dia .ring{fill:none;stroke:var(--accent);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
.dia .hullT{fill:var(--hull);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.dia .hullM{fill:var(--hull-2);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.dia .boomT{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.dia .sailT{fill:none;stroke:var(--sailT);stroke-width:2.6;stroke-linecap:round}
.dia .wake{stroke:var(--water-2);stroke-width:2.5;fill:none;stroke-linecap:round}
.dia .speed{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.dia .course{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.dia .badge{fill:var(--primary)} .dia .badgeT{fill:var(--primary-ink);font-weight:700;font-size:13px;text-anchor:middle;dominant-baseline:central}
.dia .cap{fill:var(--ink-2);font-size:12px;text-anchor:middle;font-style:italic}
.dia .windc{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.dia .winda{stroke:var(--primary);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .windt{fill:var(--primary);font-size:11px;font-weight:700;text-anchor:middle;letter-spacing:.08em}
.dia .lbl{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle}
.dia .num{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.dia .bRed{fill:var(--red);stroke:rgba(0,0,0,.35);stroke-width:1.5}
.dia .bGreen{fill:var(--green);stroke:rgba(0,0,0,.35);stroke-width:1.5}
.dia .bWhite{fill:#fbfbf8;stroke:#8a8a80;stroke-width:1.5}
.dia .bOrange{fill:var(--orange)}
.dia .sym{fill:none;stroke:var(--orange);stroke-width:4;stroke-linejoin:round}
.dia .shine{fill:#fff;opacity:.18}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.12)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes float{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-40px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes breathe{0%,100%{transform:scale(.72)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}
  .breathe{animation:none;transform:scale(.9)}
}
@media (max-width:480px){
  .prompt{font-size:1.2rem}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat b{font-size:1.15rem}
  .hero h2{font-size:1.35rem}
  header.app .pill.hide-sm{display:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="bar"></div>
<dialog id="settings"></dialog>
<script>
"use strict";
/* ================================================================
   Helpers
   ================================================================ */
const $ = (s, el = document) => el.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const strip = html => html.replace(/<\/?(strong|b|i|em)>/g, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const rad = d => d * Math.PI / 180;
const norm = a => { a = ((a % 360) + 540) % 360 - 180; return a === -180 ? 180 : a; };
const f1 = n => Math.round(n * 10) / 10;
const DAY = 864e5;

/* ================================================================
   Topics
   ================================================================ */
const TOPICS = [
  { id: 'boat',    name: 'Boat parts',            icon: '⛵' },
  { id: 'sail',    name: 'Sails & sail parts',    icon: '🔺' },
  { id: 'gear',    name: 'Lines & hardware',      icon: '⚙️' },
  { id: 'terms',   name: 'Sailing terms',         icon: '📖' },
  { id: 'wind',    name: 'Wind & points of sail', icon: '🧭' },
  { id: 'row',     name: 'Right of way',          icon: '⚖️' },
  { id: 'nav',     name: 'Buoys & markers',       icon: '🛟' },
  { id: 'safety',  name: 'Safety & float plans',  icon: '🦺' },
  { id: 'signals', name: 'Sound signals & lights',icon: '📯' },
  { id: 'knots',   name: 'Knots',                 icon: '🪢' },
];
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));

/* ================================================================
   Diagrams
   ================================================================ */
function svgWrap(inner, label, vb = '0 0 340 250') {
  return `<svg class="dia" viewBox="${vb}" role="img" aria-label="${esc(label)}"><rect class="sea" x="-20" y="-20" width="400" height="300"/>${inner}</svg>`;
}

/* Side view of a sloop; `hl` = id of the part to highlight */
function boatSide(hl) {
  const c = (id, base) => `${base}${hl === id ? ' hl' : ''}`;
  return `<svg class="dia" viewBox="0 0 400 345" role="img" aria-label="Side view of a sailboat with one part highlighted">
  <rect class="sky" x="0" y="0" width="400" height="345"/>
  <rect class="sea" x="0" y="266" width="400" height="79"/>
  <path class="${c('keel', 'solid')}" d="M185,272 L242,272 L233,328 L201,328 Z"/>
  <path class="${c('rudder', 'solid')}" d="M92,271 L113,272 L107,318 L96,316 Z"/>
  <path class="hullshape" d="M58,240 L342,230 Q331,258 300,272 L100,274 Q70,268 58,240 Z"/>
  <path class="${c('deck', 'deckline')}" d="M58,240 L342,230"/>
  <path class="${c('cabin', 'solid')}" d="M150,236.8 L158,220 L252,218 L262,232.8 Z"/>
  <circle class="port" cx="180" cy="227" r="2.6"/><circle class="port" cx="200" cy="226.6" r="2.6"/><circle class="port" cx="220" cy="226.2" r="2.6"/>
  <path class="${c('mainsail', 'sailfill')}" d="M209,44 L207,191 L90,187 Q122,104 209,44 Z"/>
  <path class="${c('jib', 'sailfill')}" d="M229,68 L326,219 L235,211 Q240,140 229,68 Z"/>
  <path class="edge" d="M229,68 L326,219 L235,211 Q240,140 229,68"/>
  <path class="${c('luff', 'edge')}" d="M209,46 L207,190"/>
  <path class="${c('foot', 'edge')}" d="M207,190 L91,186"/>
  <path class="${c('leech', 'edge')}" d="M90,187 Q122,104 209,44"/>

function windBadge(w) {
  return `<g><circle class="windc" cx="36" cy="36" r="24"/>
    <g transform="translate(36 36) rotate(${f1(w)})"><path class="winda" d="M0,-14 L0,12 M-6,5 L0,12 L6,5"/></g>
    <text class="windt" x="36" y="76">WIND</text></g>`;
}

/* Top view boat. h = heading (0 = up, clockwise), w = direction wind comes FROM */
function boatTop({ x, y, h, w, label, type = 'sail', side = 1, speed = false }) {
  const rel = norm(w - h);
  let g = `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(h)}) scale(1.25)">`;
  let sd = 1;
  if (speed) g += `<path class="speed" d="M-14,30 L-14,46 M0,30 L0,52 M14,30 L14,46"/>`;
  if (type === 'motor') {
    g += `<path class="wake" d="M-9,24 L-18,44 M9,24 L18,44"/>`;
    g += `<path class="hullM" d="M0,-26 C9,-20 11,-6 11,20 L-11,20 C-11,-6 -9,-20 0,-26 Z"/>`;
    g += `<rect class="hullT" x="-6" y="-6" width="12" height="13" rx="2"/>`;
  } else {
    g += `<path class="hullT" d="M0,-28 C10,-18 12,0 10,21 L-10,21 C-12,0 -10,-18 0,-28 Z"/>`;
    const a = Math.abs(rel);
    sd = rel > 0 ? -1 : rel < 0 ? 1 : side;
    if (a > 178) sd = side;
    if (a < 32) {
      g += `<path class="sailT" d="M0,-8 q4,4 0,7 q-4,4 0,7 q4,4 0,7 q-4,4 0,7"/>`;
      g += `<path class="sailT" d="M0,-27 q3,3 0,5 q-3,3 0,5 q3,3 0,5"/>`;
      g += `<path class="boomT" d="M0,-8 L0,19"/>`;
    } else {
      const b = rad(Math.min(85, Math.max(8, (a - 30) * 0.55 + 8)));
      const L = 27, ex = sd * Math.sin(b) * L, ey = -8 + Math.cos(b) * L;
      const mx = ex / 2, my = (-8 + ey) / 2;
      const vx = ex, vy = ey + 8, vl = Math.hypot(vx, vy);
      let nx = -vy / vl, ny = vx / vl; if (nx * sd < 0) { nx = -nx; ny = -ny; }
      g += `<path class="sailT" d="M0,-8 Q${f1(mx + nx * 7)},${f1(my + ny * 7)} ${f1(ex)},${f1(ey)}"/>`;
      g += `<path class="boomT" d="M0,-8 L${f1(ex)},${f1(ey)}"/>`;
      const jx = sd * (2 + Math.sin(b) * 11), jy = -5;
      g += `<path class="sailT" d="M0,-27 Q${f1(sd * (4 + Math.sin(b) * 9))},-17 ${f1(jx)},${jy}"/>`;
    }
    g += `<circle cx="0" cy="-8" r="2.4" fill="currentColor"/>`;
  }
  g += `</g>`;
  if (label) {
    const lx = type === 'motor' ? 30 : -sd * 31, ly = 2;
    const cx = x + lx * Math.cos(rad(h)) - ly * Math.sin(rad(h));
    const cy = y + lx * Math.sin(rad(h)) + ly * Math.cos(rad(h));
    g += `<circle class="badge" cx="${f1(cx)}" cy="${f1(cy)}" r="10"/><text class="badgeT" x="${f1(cx)}" y="${f1(cy)}">${label}</text>`;
  }
  return g;
}
const dirv = h => [Math.sin(rad(h)), -Math.cos(rad(h))];
const rotp = ([x, y], w) => [x * Math.cos(rad(w)) - y * Math.sin(rad(w)), x * Math.sin(rad(w)) + y * Math.cos(rad(w))];

/* Build a scene in a "wind from the top" frame, then rotate it by w */
function scene(boats, w, opts = {}) {
  const C = [185, 128];
  let inner = '';
  const placed = boats.map(b => {
    const [px, py] = rotp([b.x, b.y], w);
    return { ...b, gx: C[0] + px, gy: C[1] + py, gh: b.h + w };
  });
  for (const b of placed) {
    if (b.course) {
      const [mx, my] = rotp(b.course, w);
      inner += `<path class="course" d="M${f1(b.gx)},${f1(b.gy)} L${f1(C[0] + mx)},${f1(C[1] + my)}"/>`;
    }
  }
  for (const b of placed) inner += boatTop({ x: b.gx, y: b.gy, h: b.gh, w, label: b.label, type: b.type, side: b.side, speed: b.speed });
  for (const b of placed) if (b.caption) inner += `<text class="cap" x="${f1(b.gx)}" y="${f1(b.gy + 50)}">${esc(b.caption)}</text>`;
  inner += windBadge(w);
  return { svg: svgWrap(inner, opts.label || 'Diagram of boats with wind direction'), placed };
}
const tackOf = (h, w) => norm(w - h) > 0 ? 'starboard' : 'port';
const sceneRot = () => Math.random() < 0.65 ? 0 : pick([90, 180, 270, rnd(360)]);

function distract(t, n, filter = () => true) {
  const ok = x => x.id !== t.id && filter(x) && !(t.avoid || []).includes(x.id) && !(x.avoid || []).includes(t.id);
  const same = shuffle(TERMS.filter(x => x.group === t.group && ok(x)));
  const topic = shuffle(TERMS.filter(x => x.topic === t.topic && x.group !== t.group && ok(x)));
  const rest = shuffle(TERMS.filter(x => x.topic !== t.topic && ok(x)));
  return [...same, ...topic, ...rest].slice(0, n);
}
function buildTerm(t) {
  const G = GROUPS[t.group];
  const modes = ['def', 'rev'];
  if (t.part) modes.push('pic', 'pic');
  const mode = pick(modes);
  const hook = t.hook;
  const explain = `**${t.name}**: ${t.def}`;
  if (mode === 'pic') {
    const ds = distract(t, 3, x => !!x.part);
    return { mode, prompt: md(`What is the **highlighted** part?`), svg: boatSide(t.part), explain, hook,
      options: shuffle([{ t: t.name, ok: true }, ...ds.map(d => ({ t: d.name, ok: false }))]) };
  }
  const ds = distract(t, 3);
  if (mode === 'rev') {
    return { mode, prompt: `${esc(G.rev)}<blockquote>${md(t.def)}</blockquote>`, explain, hook,
      options: shuffle([{ t: t.name, ok: true }, ...ds.map(d => ({ t: d.name, ok: false }))]) };
  }
  return { mode, prompt: md(t.ask || G.ask(t.name)), explain, hook,
    options: shuffle([{ t: t.def, ok: true }, ...ds.map(d => ({ t: d.def, ok: false }))]) };
}
for (const t of TERMS) CARDS.push({ id: 't-' + t.id, topic: t.topic, ref: t.ref, build: () => buildTerm(t) });

}

      options: shuffle([...a.map(t => ({ t, ok: true })), ...w.map(t => ({ t, ok: false }))]) };

}

const TURN_GAP = [3, 6, 12, 25, 50, 100, 200];
const DAY_GAP = [0, 0, 1, 3, 7, 14, 30];
const MASTERED = 4;
const st = id => S.cards[id];
function isDue(s) {
  if (!s) return false;

}
const activeCards = () => CARDS.filter(c => S.settings.topics.includes(c.topic));

function pickNext(pool, lastId) {
  const seen = pool.filter(c => st(c.id) && c.id !== lastId);
  const unseen = pool.filter(c => !st(c.id));
  const due = seen.filter(c => isDue(st(c.id)));
  const struggling = due.filter(c => st(c.id).box === 0);
  const takeNew = unseen.length && !struggling.length && (due.length === 0 || Math.random() < 0.4);
  if (due.length && !takeNew) {
    const ranked = due.map(c => ({ c, k: st(c.id).box * 10 - (S.turn - st(c.id).due) + Math.random() * 4 })).sort((a, b) => a.k - b.k);
    return ranked[0].c;
  }
  if (unseen.length) {
    const recent = new Set(sess.recentTopics.slice(-2));
    const fresh = unseen.filter(c => !recent.has(c.topic));
    return pick(fresh.length ? fresh : unseen);
  }
  const rest = (seen.length ? seen : pool).slice().sort((a, b) => (st(a.id)?.due ?? 0) - (st(b.id)?.due ?? 0) + (Math.random() - .5) * 6);
  return rest[0];
}
/* g: 0 again, 1 hard, 2 good, 3 easy */
function grade(id, g) {
  S.turn++;

  s.seen++; s.last = Date.now();
  if (g === 0) { s.wrong++; s.box = 0; s.due = S.turn + TURN_GAP[0]; }
  else {
    s.right++;
    if (g === 1) s.box = Math.max(1, s.box - 1);
    if (g === 2) s.box = Math.min(6, s.box + 1);
    if (g === 3) s.box = Math.min(6, s.box + 2);
    s.due = S.turn + Math.round(TURN_GAP[s.box] * (g === 3 ? 1.5 : 1));
  }
  S.cards[id] = s;
}
function topicStats(tid) {

    const gain = cur.hinted ? 5 : 10; S.xp += gain; sess.xp += gain; xpFloat(gain);
    if (sess.run > S.bestRun) S.bestRun = sess.run;
    if (sess.run && sess.run % 5 === 0) { toast(`🔥 ${sess.run} in a row!`); confetti(); }
  } else { sess.run = 0; S.xp += 2; sess.xp += 2; }
  tone(cur.ok);
  const praise = pick(['Nice!', 'Correct!', 'Spot on!', 'Yes!', 'Well sailed!']);
  const title = cur.ok ? `✓ ${praise}` : cur.revealed ? 'Here\'s the answer' : 'Not quite. Here\'s the key idea:';
  $('#fb').innerHTML = `<div class="fb ${cur.ok ? 'good' : 'bad'}"><h3>${title}</h3>
    <p>${md(cur.q.explain || '')}</p>
    ${cur.q.hook ? `<div class="hook">💡 <b>Memory hook:</b> ${md(cur.q.hook)}</div>` : ''}
    <div class="ref">📘 ${esc(refText(cur.card.ref))}${cur.ok ? '' : ' · this card will come back in a few questions'}</div></div>`;
  $('.segs').innerHTML = segs();
  renderBar();
  setTimeout(() => $('#fb')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' }), 60);
  save();
}
function hint() {
  if (cur.answered || cur.hinted || cur.q.multi || sess.mode === 'exam') return;
  const wrong = shuffle(cur.q.options.map((o, i) => (!o.ok ? i : -1)).filter(i => i >= 0)).slice(0, 2);
  wrong.forEach(i => { cur.gone.add(i); const b = document.querySelectorAll('.opt')[i]; b.classList.add('gone'); b.disabled = true; });
  cur.hinted = true; renderBar();
}
function reveal() {
  if (cur.answered || sess.mode === 'exam') return;
  cur.revealed = true; evaluate();
}
function rate(g) {
  if (!cur.answered) return;
  const before = st(cur.card.id)?.box ?? -1;
  grade(cur.card.id, g);
  if (before < MASTERED && st(cur.card.id).box >= MASTERED) sess.promoted++;
  save();
  sess.done++;
  next();
}

function renderSummary() {
  view = 'summary';
  const pct = Math.round(sess.right / sess.total * 100);
  const mins = Math.max(1, Math.round((Date.now() - sess.start) / 60000));
  const msg = pct >= 90 ? 'Outstanding focus!' : pct >= 70 ? 'Solid round!' : pct >= 50 ? 'Good effort. The ones you missed will come back.' : 'Tough round, and that\'s how you learn. The ones you missed are queued up.';
  if (pct >= 80) confetti();
  save();
  app.innerHTML = `${header()}
  <section class="card center">
    <div class="big">${pct >= 80 ? '🏆' : pct >= 50 ? '⛵' : '🌊'}</div>
    <h2 style="margin:0">${sess.right} / ${sess.total} correct</h2>
    <p style="color:var(--ink-2)">${msg}</p>
    <div class="segs" style="margin:10px 0 16px" aria-hidden="true">${segs()}</div>
    <div class="stats">
      <div class="stat"><b>+${sess.xp}</b><span>XP earned</span></div>
      <div class="stat"><b>${sess.promoted}</b><span>newly mastered</span></div>
      <div class="stat"><b>${mins}m</b><span>focused</span></div>
    </div>
    ${mins >= 15 ? '<p style="color:var(--accent);font-weight:700">You\'ve been at it a while. A short break now will help you remember more.</p>' : ''}
    <div class="row">
      <button class="btn primary" data-act="practice">▶ Another round <span class="kbd">⏎</span></button>
      <button class="btn secondary" data-act="break">🧘 1-minute break</button>
    </div>
    <button class="btn ghost block" data-act="home" style="margin-top:8px">Back to topics</button>
  </section>`;
  bar.innerHTML = '';
}
let breakTimer = null;
function renderBreak() {
  view = 'break';
  let left = 60;
  app.innerHTML = `${header()}<section class="card center">
    <h2 style="margin:0">Micro-break</h2>
    <p style="color:var(--ink-2)">Look away from the screen. Breathe in as the circle grows and out as it shrinks. Roll your shoulders.</p>
    <div class="breathe" aria-hidden="true"></div>
    <p><b id="left">60</b> seconds</p>
    <button class="btn primary block" data-act="practice">I'm back, next round</button>
    <button class="btn ghost block" data-act="home" style="margin-top:8px">Back to topics</button></section>`;
  clearInterval(breakTimer);
  breakTimer = setInterval(() => {
    left--; const el = $('#left'); if (!el || view !== 'break') return clearInterval(breakTimer);
    el.textContent = left;
    if (left <= 0) { clearInterval(breakTimer); el.parentElement.innerHTML = '<b>Break done. Ready when you are.</b>'; tone(true); }
  }, 1000);
}
function renderExamResult() {
  view = 'result';
  const pct = Math.round(sess.right / sess.total * 100), pass = pct >= 80;
  for (const a of sess.answers) if (!a.ok) { const s = st(a.card.id); S.turn++; S.cards[a.card.id] = { ...(s || { seen: 0, right: 0, wrong: 0 }), box: 0, due: S.turn, last: Date.now(), seen: (s?.seen || 0) + 1, wrong: (s?.wrong || 0) + 1 }; }
  S.xp += sess.right * 5; save();
  if (pass) confetti();
  const missed = sess.answers.filter(a => !a.ok);
  app.innerHTML = `${header()}
  <section class="card center">
    <div class="big">${pass ? '🎉' : '📚'}</div>
    <h2 style="margin:0">${pct}%: ${pass ? 'Pass!' : 'Not yet'}</h2>
    <p style="color:var(--ink-2)">${sess.right} of ${sess.total} correct. You need 80% to pass. ${pass ? 'You\'re ready for the written exam.' : 'The questions you missed are now first in line for practice.'}</p>
    <div class="row"><button class="btn primary" data-act="practice">▶ Practice missed questions</button><button class="btn secondary" data-act="home">Home</button></div>
  </section>
  ${missed.length ? `<div class="section-title">Review: ${missed.length} missed</div><section class="card">
    ${missed.map(a => `<div class="miss"><div class="q">${strip(a.q.prompt)}</div>
      ${a.q.svg ? `<div class="figure" style="max-width:320px;margin-top:8px">${a.q.svg}</div>` : ''}
      <div class="y">Your answer: ${a.sel.map(i => esc(a.q.options[i].t)).join('; ') || '(none)'}</div>
      <div class="a">✓ ${a.q.options.filter(o => o.ok).map(o => esc(o.t)).join('; ')}</div>
      <p style="margin:6px 0 0;color:var(--ink-2)">${md(a.q.explain || '')}</p></div>`).join('')}
  </section>` : ''}`;
  bar.innerHTML = '';
}

/* Settings dialog */
const dlg = $('#settings');
function openSettings() {
  const s = S.settings;
  dlg.innerHTML = `<h2>Settings</h2><div class="settings">
    <label>Theme <span class="seg">${['auto', 'light', 'dark'].map(t => `<button data-act="theme" data-v="${t}" aria-pressed="${s.theme === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</span></label>
    <label>Text size <span class="seg">${[[0.9, 'A−'], [1, 'A'], [1.15, 'A+'], [1.3, 'A++']].map(([v, l]) => `<button data-act="scale" data-v="${v}" aria-pressed="${s.scale === v}">${l}</button>`).join('')}</span></label>
    <label>Sound feedback <span class="seg">${[[false, 'Off'], [true, 'On']].map(([v, l]) => `<button data-act="sound" data-v="${v}" aria-pressed="${s.sound === v}">${l}</button>`).join('')}</span></label>
    <label>Reset all progress <button class="btn secondary" data-act="reset" style="min-height:40px;padding:6px 12px">Reset</button></label>
  </div><button class="btn primary block" data-act="closeSettings" style="margin-top:14px">Done</button>`;
  if (!dlg.open) dlg.showModal();
}

/* ================================================================
   Events
   ================================================================ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  switch (a) {
    case 'practice': return startPractice();
    case 'exam': return startExam();
    case 'home': clearInterval(breakTimer); return renderHome();
    case 'break': return renderBreak();
    case 'sprint': S.settings.sprint = +b.dataset.n; save(); return renderHome();
    case 'topic': {
      const id = b.dataset.id, t = S.settings.topics;
      S.settings.topics = t.includes(id) ? t.filter(x => x !== id) : [...t, id];
      save(); return renderHome();
    }
    case 'opt': return choose(+b.dataset.i);
    case 'submit': return cur.sel.size && evaluate();
    case 'hint': return hint();
    case 'reveal': return reveal();
    case 'rate': return rate(+b.dataset.g);
    case 'speak': return speak(strip(cur.q.prompt) + '. ' + cur.q.options.map((o, i) => `Option ${i + 1}: ${o.t}`).join('. '));
    case 'quit':
      if (sess.mode === 'practice' && sess.done > 0) { sess.total = sess.done; return renderSummary(); }
      return renderHome();
    case 'settings': return openSettings();
    case 'closeSettings': dlg.close(); return view === 'home' ? renderHome() : null;
    case 'theme': S.settings.theme = b.dataset.v; break;
    case 'scale': S.settings.scale = +b.dataset.v; break;
    case 'sound': S.settings.sound = b.dataset.v === 'true'; if (S.settings.sound) tone(true); break;
    case 'reset':
      if (b.dataset.confirm) { const keep = S.settings; S = structuredClone(DEFAULTS); S.settings = keep; save(); dlg.close(); return renderHome(); }
      b.dataset.confirm = '1'; b.textContent = 'Tap again to confirm'; return;
  }
  if (['theme', 'scale', 'sound'].includes(a)) { save(); applySettings(); openSettings(); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || dlg.open) return;
  const k = e.key.toLowerCase();
  const ae = document.activeElement;
  const onButton = ae && ae.tagName === 'BUTTON' && !ae.classList.contains('opt');
  if (k === 'enter' && onButton) return;
  if (view === 'home' && k === 'enter') { e.preventDefault(); return activeCards().length && startPractice(); }
  if (view === 'summary' && k === 'enter') { e.preventDefault(); return startPractice(); }
  if (view !== 'card') return;
  if (!cur.answered) {
    if (/^[1-9]$/.test(k)) { e.preventDefault(); return choose(+k - 1); }
    if (k === 'h') return hint();
    if (k === 's') return reveal();
    if (k === 'enter' && cur.sel.size && (cur.q.multi || sess.mode === 'exam')) { e.preventDefault(); return evaluate(); }
  } else {
    if (!cur.ok && (k === 'enter' || k === ' ')) { e.preventDefault(); return rate(0); }
    if (cur.ok) {
      if (k === '1') return rate(1);
      if (!cur.hinted && (k === '2' || k === 'enter' || k === ' ')) { e.preventDefault(); return rate(2); }
      if (cur.hinted && (k === 'enter' || k === ' ')) { e.preventDefault(); return rate(1); }
      if (!cur.hinted && k === '3') return rate(3);
    }
  }
});

applySettings();
renderHome();
</script>
</body>
</html>
